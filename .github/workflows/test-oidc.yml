name: Test OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "Token received: $(echo $TOKEN | python3 -c "import sys,json; t=json.load(sys.stdin)['value']; parts=t.split('.'); import base64; payload=parts[1]+'=='*3; decoded=base64.b64decode(payload).decode(); print(json.loads(decoded))" 2>/dev/null || echo 'could not decode')"
          echo "Raw token prefix: $(echo $TOKEN | cut -c1-50)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm identity
        run: aws sts get-caller-identity
